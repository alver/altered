<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altered TCG — Choose Decks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/deck_select.css">
  <script src="js/version.js"></script>
</head>
<body>
  <div id="bg-stage" aria-hidden="true"></div>
  <div id="bg-scrim" aria-hidden="true"></div>
  <div id="select-screen">
    <header>
      <div class="brand">
        <img class="brand-logo" src="assets/logos/altered-logo-color.png" alt="Altered">
        <img class="brand-eq" src="assets/logos/equinox-logo-white.png" alt="by Equinox">
      </div>
      <p class="tagline">Lead two Expeditions across the peninsula of Asgartha. Be the first to make them meet.</p>
    </header>
    <div class="deck-grid" id="deck-grid"></div>
    <footer>
      <div class="footer-text">
        <p class="step" id="step-label">Choose <b>your</b> faction</p>
        <div class="chosen" id="chosen"></div>
      </div>
      <div class="actions">
        <button class="ghost-btn" id="btn-reset">Reset</button>
        <button class="primary-btn" id="btn-start" disabled>Start game →</button>
      </div>
    </footer>
  </div>
  <div id="card-preview"></div>
  <script src="js/bg_slideshow.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/deck_select.js"></script>
</body>
</html>
